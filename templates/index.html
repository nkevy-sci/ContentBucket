<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse code and content shared by Noah S. Kevy on social media.">
    <title>Social Media Posts | Noah S. Kevy</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8f8f8;
        color: #242424;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      main,
      footer {
        width: 68%;
        margin-inline: auto;
      }

      main {
        padding-block: 3rem 2rem;
      }

      h1 {
        line-height: 1.2;
      }

      a {
        color: #174a78;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:visited {
        color: #603b78;
      }

      a:hover {
        text-decoration-thickness: 0.15em;
      }

      a:focus-visible {
        outline: 3px solid #242424;
        outline-offset: 4px;
        border-radius: 2px;
      }

      .post-list {
        padding-inline-start: 1.5rem;
      }

      .post-list li {
        margin-block: 1.5rem;
      }

      .post-list a {
        display: inline-block;
        padding-block: 0.25rem;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .post-list p {
        margin-block: 0.25rem 0;
      }

      footer {
        padding-block: 1rem 2rem;
        text-align: right;
      }

      footer small {
        font-size: 0.875rem;
        padding-right: 2px;
      }

      footer hr {
        border: none;
        height: 1px;
        background-color: #222;
      }

      @media (max-width: 48rem) {
        main,
        footer {
          width: 91%;
        }

        main {
          padding-block-start: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="main-content">
      <h1>Social Media Posts</h1>
      <!-- The builder supplies li elements containing a title link and a description paragraph. -->
      <ul class="post-list">
        $post_list
      </ul>
    </main>
    <footer>
      <hr>
      <small>All Rights Reserved. © 2026 Noah S. Kevy</small>
    </footer>
  </body>
</html>
